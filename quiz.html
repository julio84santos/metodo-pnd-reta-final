<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#edf4ff 0,#f7f9fc 48%,#f7f9fc 100%);color:var(--text)}body{min-height:100vh}.shell{min-height:100vh;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;border-bottom:1px solid rgba(228,233,242,.85);background:rgba(255,255,255,.86);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}.topin{width:min(940px,100%);margin:auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;color:var(--navy2);font-size:14px}.brand img{height:31px;width:auto}.mini{font-size:12px;color:var(--muted);white-space:nowrap}.wrap{width:min(940px,100%);margin:0 auto;padding:26px 18px 54px;flex:1}.progressbox{max-width:680px;margin:0 auto 18px}.progressmeta{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;color:#69768b;margin-bottom:8px}.progress{height:8px;background:#e4eaf3;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#f2bd3d);border-radius:999px;transition:width .35s ease}.card{max-width:680px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:clamp(24px,5vw,44px);position:relative;overflow:hidden}.card:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:rgba(23,59,115,.035);right:-100px;top:-115px}.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--green2);text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:950;margin-bottom:12px}.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}h1,h2{color:var(--navy2);letter-spacing:-.035em;line-height:1.08;margin:0}.hero h1{font-size:clamp(34px,7vw,54px)}h2{font-size:clamp(27px,5.8vw,38px)}.lead{font-size:17px;line-height:1.55;color:var(--muted);margin:15px 0 0}.highlight{color:var(--green2)}.start-points{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:24px 0}.start-point{background:#f7f9fc;border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center;font-size:12px;font-weight:800;color:#45546c}.cta{border:0;width:100%;padding:17px 19px;border-radius:13px;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;font-weight:950;font-size:16px;cursor:pointer;box-shadow:0 16px 32px -19px rgba(7,154,81,.8)}.cta:hover{filter:brightness(.98)}.micro{text-align:center;font-size:12px;color:#7a8698;margin:10px 0 0}.question{font-size:13px;color:var(--muted);font-weight:800;margin:0 0 8px}.answers{display:grid;gap:10px;margin-top:22px}.answer{width:100%;text-align:left;border:1px solid #dfe6f0;background:#fff;border-radius:15px;padding:16px 17px;font:inherit;color:var(--text);cursor:pointer;display:flex;gap:12px;align-items:center;transition:.16s ease;box-shadow:0 4px 14px rgba(23,59,115,.025)}.answer:hover{transform:translateY(-1px);border-color:#b8c9e4;background:#fafdff}.letter{width:29px;height:29px;flex:0 0 29px;border-radius:9px;background:var(--soft);display:grid;place-items:center;color:var(--navy);font-weight:950;font-size:12px}.answer strong{font-size:14.5px;line-height:1.28}.back{display:inline-flex;align-items:center;border:0;background:transparent;padding:10px 0 0;color:#6c788c;font-weight:800;cursor:pointer}.interstitial{text-align:center}.iconbubble{width:74px;height:74px;border-radius:23px;background:linear-gradient(145deg,#fff4d2,#fffbf0);display:grid;place-items:center;margin:0 auto 18px;font-size:35px;border:1px solid #f1dd9f}.belief{margin:22px 0;background:#f5f8fd;border:1px solid #dce6f4;border-radius:18px;padding:20px;text-align:left}.belief strong{color:var(--navy2)}.material-shot{margin:20px auto 0;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 16px 35px -28px rgba(18,42,75,.6);background:#fff}.material-shot img{display:block;width:100%;height:auto}.area-select{width:100%;margin-top:19px;border:1px solid #ced9e8;border-radius:13px;padding:15px;background:#fff;color:var(--text);font:inherit;font-weight:700}.loading-ring{width:64px;height:64px;border:7px solid #e7edf6;border-top-color:var(--gold);border-radius:50%;margin:8px auto 22px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.scanlist{display:grid;gap:8px;text-align:left;margin:20px auto 0;max-width:430px}.scan{display:flex;align-items:center;gap:9px;font-size:13px;color:#5c687b}.scan i{width:18px;height:18px;border-radius:50%;background:var(--softgreen);color:var(--green);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900}.result-head{text-align:center}.result-pill{display:inline-flex;padding:7px 11px;background:#fff7de;border:1px solid #ecd387;color:#785b0c;border-radius:999px;font-size:11px;font-weight:950;margin-bottom:13px}.diagnosis{background:linear-gradient(145deg,#122f5d,#173b73);color:#fff;border-radius:19px;padding:21px;margin:22px 0}.diagnosis h3{font-size:18px;margin:0 0 7px}.diagnosis p{margin:0;color:#dce7f8;font-size:14px;line-height:1.55}.plansteps{display:grid;gap:9px;margin:20px 0}.planstep{display:grid;grid-template-columns:35px 1fr;gap:11px;align-items:start;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}.planstep b{width:31px;height:31px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center}.planstep strong{display:block;color:var(--navy2);font-size:13.5px}.planstep span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}.offer{border:2px solid #e7bf53;background:linear-gradient(180deg,#fff8e5,#fff 58%);border-radius:20px;padding:22px;margin-top:24px;position:relative}.recommend{display:inline-block;background:var(--gold);color:#fff;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:950;letter-spacing:.04em}.offer h3{margin:10px 0 3px;color:var(--navy2);font-size:22px}.offer p{margin:0;color:var(--muted);font-size:13px}.price{display:flex;align-items:baseline;gap:6px;margin:14px 0 15px}.price strong{font-size:40px;color:var(--navy2);letter-spacing:-1.5px}.price span{font-size:12px;color:var(--muted)}.wa{background:#16a463}.secondary{display:block;text-align:center;margin-top:11px;padding:13px;color:var(--navy);font-weight:850;text-decoration:none;border:1px solid var(--line);border-radius:12px;background:#fff}.disclaimer{font-size:10.5px;color:#8791a1;text-align:center;margin-top:18px;line-height:1.45}.hidden{display:none!important}.fade{animation:fade .25s ease}@keyframes fade{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:620px){.wrap{padding:17px 12px 34px}.card{border-radius:20px;padding:24px 18px}.topin{padding:0 14px}.mini{display:none}.start-points{grid-template-columns:1fr}.answer{padding:15px 13px}.hero h1{font-size:37px}}

<body>
<div class="shell">
<header class="top"><div class="topin"><div class="brand"><img src="logo-pnd.png" alt="PND"><span>Método PND Reta Final</span></div><div class="mini">Diagnóstico gratuito · cerca de 2 minutos</div></div></header>
<main class="wrap">
<div class="progressbox hidden" id="progressbox"><div class="progressmeta"><span id="progressLabel">Diagnóstico PND 2026</span><span id="progressNumber">0%</span></div><div class="progress"><span id="progressBar"></span></div></div>
<section class="card hero fade" id="screen"></section>
</main>
</div>
<script>
const PRODUCT_URL='https://metodo-pnd-reta-final.vercel.app/#planos';
const WHATSAPP_NUMBER='554197759890';
const state={step:0,answers:{},history:[]};
const areas=['Arte / Artes Visuais','Ciências Biológicas','Ciências da Natureza','Ciências Sociais','Computação','Dança','Educação Física','Filosofia','Física','Geografia','História','Letras - Espanhol','Letras - Inglês','Letras - Português','Letras - Português/Espanhol','Letras - Português/Inglês','Matemática','Música','Pedagogia','Química','Teatro','Outra / ainda não defini'];
const steps=[
{key:'stage',title:'Como está sua preparação para a PND 2026 hoje?',opts:['Já estudei bastante, mas preciso revisar','Estudei algumas coisas, mas estou meio perdido(a)','Comecei há pouco tempo','Praticamente ainda não consegui revisar']},
{key:'time',title:'Quanto tempo REAL você consegue separar para estudar por dia?',opts:['Até 20 minutos','De 30 a 45 minutos','Cerca de 1 hora','Mais de 1 hora']},
{type:'interstitial',kind:'belief1'},
{key:'obstacle',title:'O que mais atrapalha sua preparação neste momento?',opts:['O edital/matriz é muito amplo','Não sei o que priorizar','Tenho pouco tempo','Estudo, mas não sei se estou evoluindo']},
{key:'behavior',title:'Quando você tenta revisar, o que costuma acontecer?',opts:['Leio bastante e retenho pouco','Pulo de material em material','Faço poucas questões','Não tenho uma sequência definida']},
{type:'interstitial',kind:'proof'},
{key:'concern',title:'Qual parte da PND mais preocupa você hoje?',opts:['Formação Geral Docente','Questão discursiva','Conteúdo específico da minha área','Tudo um pouco']},
{key:'difference',title:'O que faria MAIS diferença na sua reta final?',opts:['Ter uma rota pronta do que fazer','Revisar conceitos de forma rápida','Treinar mais questões e simulados','Saber exatamente onde estou errando']},
{key:'specific',title:'Você gostaria de incluir também treinamento específico da sua disciplina?',opts:['Sim, isso é importante para mim','Talvez, dependendo do valor','Quero focar apenas na preparação geral']},
{type:'area'},
{key:'commitment',title:'Se você tivesse uma rota objetiva pronta hoje, quando começaria?',opts:['Hoje mesmo','Ainda esta semana','Nos próximos dias','Primeiro quero entender melhor o método']},
{type:'interstitial',kind:'processing'}
];
const screen=document.getElementById('screen'),progressbox=document.getElementById('progressbox'),bar=document.getElementById('progressBar'),num=document.getElementById('progressNumber');
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderStart(){progressbox.classList.add('hidden');screen.innerHTML=`<div class="eyebrow">PND 2026 · diagnóstico de reta final</div><h1>Descubra qual deve ser sua <span class="highlight">estratégia de reta final.</span></h1><p class="lead">Responda algumas perguntas rápidas e receba uma recomendação de estudo de acordo com seu tempo, sua dificuldade e sua área.</p><div class="start-points"><div class="start-point">⏱️ Cerca de 2 minutos</div><div class="start-point">🎯 Resultado personalizado</div><div class="start-point">✓ 100% gratuito</div></div><button class="cta" onclick="startQuiz()">DESCOBRIR MEU PLANO →</button><p class="micro">Sem prova e sem pegadinha. É um diagnóstico para organizar sua preparação.</p>`}
function startQuiz(){state.step=0;state.history=[];progressbox.classList.remove('hidden');if(typeof fbq==='function')fbq('track','ViewContent',{content_name:'Quiz PND 2026'});render()}
function progress(){const total=steps.filter(x=>x.key||x.type==='area').length;let answered=Object.keys(state.answers).length;let pct=Math.min(96,Math.round((answered/total)*100));bar.style.width=pct+'%';num.textContent=pct+'%'}
function choose(key,val){state.answers[key]=val;state.history.push(state.step);state.step++;render()}
function back(){if(!state.history.length){renderStart();return}state.step=state.history.pop();const s=steps[state.step];if(s&&s.key)delete state.answers[s.key];if(s&&s.type==='area')delete state.answers.area;render()}
function answersHTML(s){return `<div class="answers">${s.opts.map((o,i)=>`<button class="answer" onclick='choose(${JSON.stringify(s.key)},${JSON.stringify(o)})'><span class="letter">${String.fromCharCode(65+i)}</span><strong>${esc(o)}</strong></button>`).join('')}</div><button class="back" onclick="back()">← Voltar</button>`}
function renderInterstitial(kind){if(kind==='belief1'){screen.innerHTML=`<div class="interstitial"><div class="iconbubble">🧭</div><div class="eyebrow">Uma virada importante</div><h2>Você não precisa recomeçar sua formação do zero.</h2><div class="belief"><strong>A reta final pede outra estratégia:</strong><br>retomar conceitos-chave, praticar questões, identificar pontos fracos e corrigir a rota.</div><button class="cta" onclick="nextInterstitial()">FAZ SENTIDO PARA MIM →</button></div>`}
else if(kind==='proof'){screen.innerHTML=`<div class="interstitial"><div class="eyebrow">Menos teoria extensa. Mais direção.</div><h2>É por isso que o método organiza cada material por função.</h2><p class="lead">Mapas para revisar. Simulados para diagnosticar. Planner para organizar. Discursiva para treinar. Painel para acompanhar.</p><div class="material-shot"><img src="promo-supercombo.png" alt="Materiais do Método PND Reta Final"></div><button class="cta" style="margin-top:18px" onclick="nextInterstitial()">CONTINUAR MEU DIAGNÓSTICO →</button></div>`}
else{renderProcessing()}}
function nextInterstitial(){state.history.push(state.step);state.step++;render()}
function renderArea(){screen.innerHTML=`<div class="eyebrow">Personalização por área</div><div class="question">Pergunta ${Object.keys(state.answers).length+1}</div><h2>Para qual área você fará a PND?</h2><p class="lead">Isso ajuda a deixar sua recomendação mais útil.</p><select class="area-select" id="areaSelect"><option value="">Selecione sua área...</option>${areas.map(a=>`<option>${esc(a)}</option>`).join('')}</select><button class="cta" style="margin-top:13px" onclick="saveArea()">CONTINUAR →</button><button class="back" onclick="back()">← Voltar</button>`}
function saveArea(){const v=document.getElementById('areaSelect').value;if(!v){document.getElementById('areaSelect').focus();return}state.answers.area=v;state.history.push(state.step);state.step++;render()}
function renderProcessing(){bar.style.width='100%';num.textContent='100%';screen.innerHTML=`<div class="interstitial"><div class="loading-ring"></div><div class="eyebrow">Analisando sua preparação</div><h2>Montando sua estratégia de reta final...</h2><div class="scanlist"><div class="scan"><i>✓</i>Tempo disponível para estudar</div><div class="scan"><i>✓</i>Principal dificuldade atual</div><div class="scan"><i>✓</i>Parte da prova que mais preocupa</div><div class="scan"><i>✓</i>Área escolhida</div></div></div>`;setTimeout(renderResult,1500)}
function recommendation(){const a=state.answers;let complete=false;if(a.specific&&a.specific!=='Quero focar apenas na preparação geral')complete=true;if(a.concern==='Conteúdo específico da minha área'||a.concern==='Tudo um pouco')complete=true;if(a.difference==='Treinar mais questões e simulados')complete=true;return complete?'Completo':'Essencial'}
function planSteps(){const a=state.answers;let arr=[];arr.push(['Organize','Use o Planner e a Reta Final de 10 Dias para saber o próximo passo.']);arr.push(['Revise','Faça uma retomada rápida com os Mapas Mentais e a Revisão Ativa.']);arr.push(['Diagnostique','Use o Simulado Diagnóstico e o Painel de Desempenho para localizar pontos fracos.']);if(a.concern==='Questão discursiva'||a.concern==='Tudo um pouco')arr.push(['Treine a discursiva','Use o Kit da Discursiva e o Checklist de Autocorreção.']);if(recommendation()==='Completo')arr.push(['Pratique sua área','Finalize com os simulados específicos da disciplina escolhida.']);return arr}
function waMessage(rec){const a=state.answers;return `Olá! Fiz o diagnóstico da PND 2026.\n\nMinha área: ${a.area||'não informada'}\nTempo de estudo: ${a.time||''}\nMinha maior dificuldade: ${a.obstacle||''}\nParte que mais preocupa: ${a.concern||''}\n\nO quiz recomendou o Kit ${rec}. Quero receber os detalhes e os materiais.`}
function goWhats(rec){const msg=encodeURIComponent(waMessage(rec));if(typeof fbq==='function')fbq('track','Contact',{content_name:'Quiz PND '+rec});if(WHATSAPP_NUMBER){location.href=`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`}else{sessionStorage.setItem('pndQuizMessage',decodeURIComponent(msg));location.href=appendUtms(PRODUCT_URL)}}
function appendUtms(url){const u=new URL(url,location.origin);const cur=new URLSearchParams(location.search);['utm_source','utm_medium','utm_campaign','utm_term','utm_content','src','sck','xcod','fbclid'].forEach(k=>{const v=cur.get(k);if(v)u.searchParams.set(k,v)});return u.toString()}
function renderResult(){const rec=recommendation(),a=state.answers,price=rec==='Completo'?'24,90':'19,90';if(typeof fbq==='function')fbq('track','CompleteRegistration',{content_name:'Diagnóstico PND',status:rec});const diagnosis=a.obstacle==='Tenho pouco tempo'?'Seu maior gargalo hoje parece ser transformar pouco tempo em uma sequência objetiva.':a.obstacle==='Não sei o que priorizar'?'Seu maior gargalo hoje não parece ser falta de conteúdo. É falta de uma rota clara de prioridade.':a.obstacle==='Estudo, mas não sei se estou evoluindo'?'Seu maior gargalo hoje é estudar sem uma medida clara de desempenho para corrigir a rota.':'Seu maior gargalo hoje é lidar com uma matriz ampla sem transformar a revisão em acúmulo de conteúdo.';screen.innerHTML=`<div class="result-head"><div class="result-pill">DIAGNÓSTICO CONCLUÍDO</div><h2>Seu caminho de reta final ficou mais claro.</h2><p class="lead">Área informada: <strong>${esc(a.area)}</strong></p></div><div class="diagnosis"><h3>Seu diagnóstico</h3><p>${diagnosis}</p></div><div class="eyebrow">Plano recomendado</div><div class="plansteps">${planSteps().map((x,i)=>`<div class="planstep"><b>${i+1}</b><div><strong>${x[0]}</strong><span>${x[1]}</span></div></div>`).join('')}</div><div class="offer"><span class="recommend">RECOMENDAÇÃO DO QUIZ</span><h3>Kit ${rec}</h3><p>${rec==='Completo'?'Para o seu perfil, faz sentido ter a preparação geral e também a prática específica da sua área. Por apenas R$ 5 a mais que o Essencial, você inclui os simulados específicos.':'Seu perfil indica foco maior na organização, Formação Geral, discursiva e revisão. O Essencial já cobre esse objetivo.'}</p><div class="price"><strong>R$ ${price}</strong><span>pagamento único · sem mensalidade</span></div><button class="cta wa" onclick="goWhats('${rec}')">CHAMAR NO WHATSAPP →</button><a class="secondary" href="${appendUtms(PRODUCT_URL)}">Ver todos os materiais e comparar planos</a></div><p class="disclaimer">Material educacional independente e extraoficial. Não possui vínculo, parceria ou chancela do INEP ou do MEC. O diagnóstico organiza a oferta conforme suas respostas e não prevê resultado ou aprovação.</p>`}
function render(){progress();const s=steps[state.step];screen.classList.remove('fade');void screen.offsetWidth;screen.classList.add('fade');if(!s){renderResult();return}if(s.type==='interstitial'){renderInterstitial(s.kind);return}if(s.type==='area'){renderArea();return}screen.innerHTML=`<div class="eyebrow">Diagnóstico PND 2026</div><div class="question">Sua resposta ajuda a personalizar o resultado</div><h2>${esc(s.title)}</h2>${answersHTML(s)}`}
renderStart();
</script>
</body>
</html>
