<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Método PND Reta Final</title></head><body><script>
(async function(){
 const r=await fetch('base.html',{cache:'no-store'}); let h=await r.text();
 const css=`
.social-proof-section{padding:68px 0;background:linear-gradient(180deg,#f7f9fc 0%,#eef4ff 100%)}
.social-proof-header{text-align:center;max-width:780px;margin:0 auto 34px}.social-proof-header h2{margin:0 0 10px;font-size:clamp(28px,3.4vw,42px);line-height:1.1;letter-spacing:-.03em;color:var(--navy)}.social-proof-header p{margin:0;color:var(--muted);font-size:16px}
.social-proof-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}.social-proof-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}.social-proof-card:hover{transform:translateY(-4px);box-shadow:0 22px 60px -28px rgba(18,42,75,.32)}
.social-proof-badge{display:inline-flex;align-items:center;gap:8px;margin:0 0 12px;padding:7px 11px;border-radius:999px;background:#f2f6fd;color:var(--navy);font-size:12px;font-weight:800}.social-proof-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.social-proof-shot{display:block;border-radius:16px;overflow:hidden;border:1px solid #edf1f7;background:#f7f9fc;cursor:zoom-in}.social-proof-shot img{display:block;width:100%;height:auto}.social-proof-copy{padding:12px 4px 2px}.social-proof-copy h3{margin:0 0 6px;font-size:16px;color:var(--navy)}.social-proof-copy p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.social-proof-note{max-width:900px;margin:24px auto 0;text-align:center;color:#758197;font-size:12.5px}.social-proof-actions{display:flex;justify-content:center;margin-top:26px}.mini-cta{display:inline-flex;padding:13px 18px;border-radius:12px;background:#fff;border:1px solid #dce5f2;color:var(--navy);text-decoration:none;font-weight:800}
.testimonial-lightbox{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(9,20,38,.82);backdrop-filter:blur(6px)}.testimonial-lightbox.active{display:flex}.testimonial-lightbox-dialog{position:relative;max-width:min(94vw,760px);max-height:92vh}.testimonial-lightbox img{display:block;max-width:100%;max-height:84vh;border-radius:18px;box-shadow:0 28px 90px -30px rgba(0,0,0,.72)}.testimonial-lightbox-close{position:absolute;top:-14px;right:-14px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:var(--navy);font-size:24px;font-weight:700;cursor:pointer}
@media(max-width:900px){.social-proof-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.social-proof-section{padding:56px 0}.social-proof-grid{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin:0 -4px;padding-inline:4px}.social-proof-card{min-width:84%;scroll-snap-align:start}}
`;
 const cards=[
 ['depo-claudia.webp','Claudia','Claudia — conteúdo e confiança','Conteúdo completo e integrado, com mais confiança na preparação.'],
 ['depo-lais.webp','Lais','Lais — organização e ganho de tempo','Material organizado para quem tem pouco tempo de estudo.'],
 ['depo-lorena-direcao.webp','Lorena','Lorena — mais direção nos estudos','Mais direção para organizar o que precisa estudar e fazer.'],
 ['depo-iraci.webp','Iraci','Iraci — revisão mais rápida','Revisão mais ágil e assuntos mais fáceis de lembrar com os mapas.'],
 ['depo-osvaldo.webp','Osvaldo','Osvaldo — revisão prática','Um retorno simples e direto sobre a utilidade do material para revisão.'],
 ['depo-lorena-inicio.webp','Lorena','Lorena — boa primeira impressão','Já começou a usar o material e gostou da experiência.']
 ].map(x=>`<article class="social-proof-card"><div class="social-proof-badge"><span class="dot"></span><span>Depoimento real</span></div><a class="social-proof-shot" href="#" data-full="${x[0]}" data-name="${x[1]}"><img loading="lazy" src="${x[0]}" alt="Print de conversa com depoimento de ${x[1]} sobre o Método PND"></a><div class="social-proof-copy"><h3>${x[2]}</h3><p>${x[3]}</p></div></article>`).join('');
 const sec=`<section class="social-proof-section" id="depoimentos"><div class="container"><div class="social-proof-header"><div class="eyebrow">Depoimentos reais</div><h2>Quem já está estudando com o Método PND conta como está sendo</h2><p>Feedbacks de professores que já começaram a usar o material na preparação para a PND 2026.</p></div><div class="social-proof-grid">${cards}</div><p class="social-proof-note">Depoimentos individuais. A experiência pode variar conforme a rotina, o ritmo de estudo e a forma de uso do material.</p><div class="social-proof-actions"><a class="mini-cta" href="#planos">Ver os planos e começar agora →</a></div></div></section><div class="testimonial-lightbox" id="testimonialLightbox" aria-hidden="true"><div class="testimonial-lightbox-dialog"><button class="testimonial-lightbox-close" type="button" aria-label="Fechar">×</button><img id="testimonialLightboxImage" src="" alt="Depoimento ampliado"></div></div>`;
 const js=`<script>(function(){var lb=document.getElementById('testimonialLightbox'),im=document.getElementById('testimonialLightboxImage');if(lb&&im){var c=lb.querySelector('.testimonial-lightbox-close');document.querySelectorAll('.social-proof-shot').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();im.src=a.dataset.full;im.alt='Depoimento ampliado de '+a.dataset.name;lb.classList.add('active');document.body.style.overflow='hidden'})});function shut(){lb.classList.remove('active');im.src='';document.body.style.overflow=''};c.addEventListener('click',shut);lb.addEventListener('click',function(e){if(e.target===lb)shut()});document.addEventListener('keydown',function(e){if(e.key==='Escape')shut()})}var pn=document.querySelector('.proof-notice');if(pn){var s=pn.closest('section');pn.remove();var e=s.querySelector('.eyebrow'),t=s.querySelector('.section-title');if(e)e.textContent='Para quem é';if(t)t.textContent='Veja se o Método PND combina com sua fase de preparação.'}})();<\/script>`;
 h=h.replace('</style>',css+'</style>');
 h=h.replace('<section id="planos">',sec+'<section id="planos">');
 h=h.replace('</body>',js+'</body>');
 document.open();document.write(h);document.close();
})().catch(function(e){document.body.innerHTML='<p style="font-family:sans-serif;padding:40px">Não foi possível carregar a página. Atualize o navegador.</p>';console.error(e)});
</script></body></html>
